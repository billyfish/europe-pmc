services:
  tomcat:
    build:
      context: .
      args:
        TOMCAT_TAG: 11.0-jre21-temurin
    image: pmc-tomcat:latest
    container_name: tomcat
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: "-XX:MaxRAMPercentage=75.0"
      TZ: Europe/London
    volumes:
      - tomcat-logs:/usr/local/tomcat/logs
    restart: unless-stopped

volumes:
  tomcat-logs:
